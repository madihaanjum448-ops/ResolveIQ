services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: resolveiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resolveiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: sh -c "python -m data.make_demo_data && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/resolveiq
      DB_PATH: /app/state/resolver.db
      DATA_DIR: /app/data/demo
    volumes:
      - "./state:/app/state"
      - "./data/demo:/app/data/demo"
      - "./eval:/app/eval"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      API_URL: http://api:8000
    volumes:
      - "./eval:/app/eval"
    ports:
      - "8501:8501"
    depends_on:
      - api

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_SECURE_COOKIE: "false"
    volumes:
      - "./n8n_data:/home/node/.n8n"
      - "./n8n:/workflows"

volumes:
  pgdata:
