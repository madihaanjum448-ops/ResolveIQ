services:
  api:
    build: .
    command: sh -c "python -m data.make_demo_data && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DB_PATH: /app/state/resolver.db
    volumes: ["./state:/app/state", "./data/demo:/app/data/demo"]
    ports: ["8000:8000"]

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      API_URL: http://api:8000
    volumes: ["./eval:/app/eval"]
    ports: ["8501:8501"]
    depends_on: [api]

  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_SECURE_COOKIE: "false"
    volumes: ["./n8n_data:/home/node/.n8n", "./n8n:/workflows"]
